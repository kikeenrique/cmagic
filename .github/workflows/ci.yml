name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  build-test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-26.04
    # The swift.org image already carries the toolchain; its version is kept in
    # step with the static SDK pinned in release.yml so both build the same Swift.
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          # Keyed separately from the macOS job: same Package.resolved, different
          # target objects, and a shared key would thrash both caches.
          path: .build
          key: linux-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: linux-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test
