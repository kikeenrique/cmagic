name: Probe glibc containers

# Throwaway diagnostic, not part of the release. `--static-swift-stdlib` fails to
# link in swift:6.4-jammy — libFoundation.a has undefined references to the
# CoreFoundation implementation behind it — and that is a property of how each
# image was built rather than of the distribution's age. This runs the same link
# across every candidate image at once to find which ones work, and at what glibc
# floor, so release.yml can be pointed at the lowest floor that links.
#
# Delete this file once that question is settled.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.container }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        container:
          # Ordered by glibc floor, lowest (most portable binary) first. ubi9 is
          # what swiftly builds its Linux release on, for exactly this reason.
          - swift:6.4-rhel-ubi9
          - swift:6.4-bookworm
          - swift:6.4-jammy
          - swift:6.4-noble
          - swift:6.4-resolute
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7

      - name: Report the floor this image would impose
        # ldd is the glibc the binary would be linked against, and so the oldest
        # system it could run on.
        run: |
          swift --version
          ldd --version | head -1

      - name: Link with --static-swift-stdlib
        # No mise and no packaging: those need apt or dnf depending on the image,
        # and the only question here is whether the static link succeeds.
        run: swift build -c release --disable-sandbox --product cmagic --static-swift-stdlib

      - name: Confirm the binary is actually static
        run: |
          bin="$(swift build -c release --disable-sandbox --product cmagic --static-swift-stdlib --show-bin-path)"
          ls -l "$bin/cmagic"
          # A Swift runtime still showing here would mean the flag did not take.
          ldd "$bin/cmagic" || echo "not a dynamic executable (fully static)"
