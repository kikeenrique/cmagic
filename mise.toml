# mise tasks for the cmagic CLI.
# The release tasks are file tasks under mise/tasks/: `package` (macOS),
# `package-linux-gnu`, `package-linux-musl`, `smoke-test` and `release`. The
# release CI runs the same `mise run package*` so a human and CI build identical
# artifacts.

[task_config]
includes = ["mise/tasks"]

[tasks.build]
description = "Debug build"
run = "swift build"

[tasks.test]
description = "Run tests"
run = "swift test"
